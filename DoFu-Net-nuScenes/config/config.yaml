# DoFu-Net nuScenes configuration.
# Set NUSCENES_ROOT to your local nuScenes path (or edit data_root_dir below).
data:
  data_root_dir: "/path/to/nuscenes"
  database_path: "bs_db.npy"
  train_query_path: "bs_train_query.npy"
  test_query_path: "bs_test_query.npy"
  val_query_path: "bs_val_query.npy"
  info_path: "nuscenes_infos-bs.pkl"
  # Relative to nuScenes root. You can keep your existing preprocessed directory name here.
  lidar_view_dir: "samples/RANGE_DOFU_3VIEW"

runner:
  nonTrivPosDistThres: 9
  posDistThr: 18
  nNeg: 4
  nNegSample: 1000
  margin: 0.5
  resize: [192, 512]
  cache_every: 3
  visual_backbone: convnextv2_atto
  # Relative to the DoFu-Net repository root, or set an absolute path.
  convnextv2_ckpt_path: "weights/convnextv2_atto/model.safetensors"

  lr: 0.00001
  step_size: 6
  gamma: 0.5
  num_epochs: 120

  num_workers_train: 6
  num_workers_test: 8
  resume_path:
  resume_scheduler: False
  log: False

  ckpt_dir: "runs/checkpoints/"
  result_dir: "runs/results/"
  cache_dir: "runs/cache/"
  log_dir: "runs/logs/"
